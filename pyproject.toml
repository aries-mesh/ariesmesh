[project]
name = "aries-mesh"
version = "0.1.0"
description = "A personal compute fabric for your device mesh"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Core — pure Python (or has ARM wheels on PyPI) so `pip install aries-mesh`
    # works on every platform that can run CPython 3.11+, including Termux on
    # Android. Heavier deps (zeroconf, litellm, psutil, blake3, aiohttp, …)
    # live under the [full] extra; the code degrades gracefully without them.
    "pynacl>=1.5.0",
    "cbor2>=5.6.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "noiseprotocol>=0.3.1",
]

[project.optional-dependencies]
# Full desktop install. mDNS discovery (zeroconf), LLM adapters (litellm),
# hardware profiling (psutil), faster hashing (blake3), the web dashboard
# (aiohttp), the macOS/Linux event loop (uvloop), and the reserved websocket
# transport. Everything below is optional at runtime — the daemon will start
# without any of them, falling back to safe defaults or warnings.
full = [
    "zeroconf>=0.131.0",
    "litellm>=1.40.0,<1.50.0",
    "psutil>=5.9.0",
    "uvloop>=0.19.0;platform_system!='Windows'",
    "websockets>=12.0",
    "blake3>=0.4.0",
    "aiohttp>=3.9.0",
]

# Distributed inference engine.
inference = ["llama-cpp-python>=0.3.0"]

# Optional embedding/semantic deps (kept from earlier extras).
semantic = ["sentence-transformers>=3.0.0", "numpy>=1.26.0"]

# Contributors: install everything plus the test runner / linter so the
# full 82-test suite passes locally.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "zeroconf>=0.131.0",
    "litellm>=1.40.0,<1.50.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
    "blake3>=0.4.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
aries = "aries.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aries*"]

[tool.setuptools.package-data]
# Ship the built React dashboard inside the wheel so end users never need
# Node/npm. The artifacts live in src/aries/dashboard/dist/ and are committed.
"aries.dashboard" = ["dist/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
