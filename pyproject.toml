[project]
name = "aries-mesh"
version = "0.1.0"
description = "A personal compute fabric for your device mesh"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5.0",
    "cbor2>=5.6.0",
    "zeroconf>=0.131.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "litellm>=1.40.0,<1.50.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "uvloop>=0.19.0; platform_system != 'Windows'",
    "websockets>=12.0",
    "blake3>=0.4.0",
    "pyyaml>=6.0",
    "noiseprotocol>=0.3.1",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
# psutil isn't installable on Android/Termux. It's an optional dep so plain
# `pip install aries-mesh` succeeds there; the profiler returns safe defaults.
# Anyone on a normal platform should install with `aries-mesh[full]`.
full = ["psutil>=5.9.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4.0", "psutil>=5.9.0"]
semantic = ["sentence-transformers>=3.0.0", "numpy>=1.26.0"]
inference = ["llama-cpp-python>=0.3.0"]

[project.scripts]
aries = "aries.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aries*"]

[tool.setuptools.package-data]
# Ship the built React dashboard inside the wheel so end users never need
# Node/npm. The artifacts live in src/aries/dashboard/dist/ and are committed.
"aries.dashboard" = ["dist/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
